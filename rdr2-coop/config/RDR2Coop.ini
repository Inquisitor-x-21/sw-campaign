; RDR2 Co-op - settings
; Put this file next to RDR2Coop.asi in the game folder.
; Press the Reload Config key in game to apply [Sync], [Tuning], [Display] and
; [Hotkeys] changes without restarting. [Network] and [Player] apply the next
; time you host or join.

[Network]
; UDP port the host listens on. Forward it on your router only if friends join
; over the internet without a VPN.
HostPort = 7777
; Where Join connects. 127.0.0.1 = this PC (second game instance or test bots).
; Use the host's LAN or VPN address (for example 192.168.1.20) otherwise.
JoinAddress = 127.0.0.1
JoinPort = 7777
; Host only: 2 to 4 players, host included.
MaxPlayers = 4
; How many position updates per second you send (5 to 60).
SendRateHz = 20

[Player]
; Empty = "Player <number>".
Name =
; What other players see you as. Generic outlaws with no story role:
;   g_m_m_uniduster_01        (184 outfits)   g_m_m_unicriminals_01 (150)
;   g_m_m_unibanditos_01      (167)           g_m_m_unimountainmen_01 (129)
;   g_m_y_uniexconfeds_01     (124)           g_m_m_uniranchers_01  (87)
Model = g_m_m_uniduster_01
; Outfit preset number (0 up to the count above minus one). -1 = random,
; which can look different on each player's screen.
Outfit = 0
; Horse used when another player's horse breed can't be loaded.
FallbackHorse = a_c_horse_kentuckysaddle_black

[Sync]
; How far in the past other players are shown, in ms. More = smoother on bad
; connections, less = more responsive. 100 suits LAN, try 150 over the internet.
InterpDelayMs = 100
; If updates stop, keep moving a player along their last direction this long.
MaxExtrapolationMs = 250
; A jump bigger than this (metres) is treated as a teleport, not a slide.
TeleportDistance = 25
; Hybrid = real walking/riding animations with corrections.
; Teleport = exact position every frame, slides without animation (fallback).
OnFootMovement = Hybrid
MountedMovement = Hybrid
; Clients follow the host's time of day.
ClockSync = true
; Clients appear next to the host when they join.
TeleportOnJoin = true

[Tuning]
; Hybrid movement only. Changes apply on Reload Config.
CorrectionStart = 1.0
CorrectionGain = 1.5
RetaskMs = 400
LookaheadSeconds = 0.5

[Display]
Overlay = true
Blips = true
BlipStyle = BLIP_STYLE_MP_PLAYER

[Hotkeys]
; F1-F24, A-Z, 0-9, NUMPAD0-9, INSERT, DELETE, HOME, END, PAGEUP, PAGEDOWN, NONE
Host = F7
Join = F8
Leave = F9
ToggleOverlay = F10
Regroup = F11
ReloadConfig = F6

[Debug]
; Extra detail in RDR2Coop_<process id>.log.
VerboseLog = false
; How often sync quality numbers are written to the log (ms, 0 = off).
StatsIntervalMs = 10000
